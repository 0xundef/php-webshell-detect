name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.23.x'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: make test

      - name: Vet
        run: make vet vet-all

      - name: Check formatting
        run: make fmt-check

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          GIT_COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          GO_VERSION_FULL="$(go version | awk '{print $3}')"
          mkdir -p output
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build \
            -ldflags "-X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GIT_COMMIT} -X main.GoVersion=${GO_VERSION_FULL} -w -s" \
            -o "output/webshell-detect-${GOOS}-${GOARCH}${ext}" \
            ./cmd/webshell-detect

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webshell-detect-${{ matrix.goos }}-${{ matrix.goarch }}
          path: output/
          retention-days: 14

  release:
    name: Release
    needs: [test, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
