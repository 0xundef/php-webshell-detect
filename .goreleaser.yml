version: 2

project_name: webshell-detect

builds:
  - id: webshell-detect
    main: ./cmd/webshell-detect
    binary: webshell-detect
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{ .Version }}
      - -X main.BuildTime={{ .Date }}
      - -X main.GitCommit={{ .Commit }}

archives:
  - id: default
    builds:
      - webshell-detect
    name_template: >-
      {{ .ProjectName }}-{{ title .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}-{{ .Version }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - config/conf.yaml
      - config/mock.php
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^style:'
      - '^refactor:'

release:
  draft: false
  prerelease: auto
